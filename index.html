<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROCKET AI</title><meta name="theme-color" content="#000000">
<style>
:root{--g:#f5b82e;--p:#0d0d0f;--b:#232326;--t:#ececec;--m:#8b8b92}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--t);font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#0b1430,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s}
.ring{position:relative;width:min(66vw,300px);aspect-ratio:1;transition:opacity .5s}
.ring img,.fb{width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 0 40px #f5b82e66}
.fb{display:grid;place-items:center;border:3px solid var(--g);font:800 30px sans-serif;color:var(--g);background:#05070d}
.orbit{position:absolute;inset:-7%;animation:spin 2.6s linear infinite}
.rk{position:absolute;top:0;left:50%}
.rk i{position:absolute;left:-16px;top:-18px;width:32px;height:32px;display:block}
.rk i:before{content:"";position:absolute;right:26px;top:11px;width:46px;height:12px;border-radius:50%;background:linear-gradient(90deg,transparent,#ff4d00,#ffd54a);filter:blur(2px);animation:fl .12s infinite alternate}
.rk span{position:absolute;font-size:30px;line-height:1;transform:rotate(45deg)}
#big{position:absolute;width:90px;height:90px;opacity:0;pointer-events:none}
.go .ring,.go h1,.go small{opacity:0}.go #big{animation:zoom 1.3s cubic-bezier(.6,0,1,.6) forwards}
h1{font:800 34px/1 sans-serif;letter-spacing:3px;transition:opacity .4s}h1 b{color:var(--g)}
#splash small{position:absolute;bottom:34px;color:var(--m);letter-spacing:2px}small b{color:var(--g)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fl{to{transform:scaleX(.6);opacity:.8}}
@keyframes zoom{0%{opacity:1;transform:scale(.3)}100%{opacity:1;transform:scale(30)}}
#root{height:100%}
.auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--p);border:1px solid var(--b);border-radius:20px;padding:26px;text-align:center}
.card img{width:84px;border-radius:50%}.card h2{margin:10px 0 4px;font-size:22px}.card h2 b,.hl{color:var(--g)}
.tabs{display:flex;background:#000;border-radius:12px;padding:4px;margin:16px 0}.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--m)}.tabs .on{background:var(--b);color:#fff}
input,textarea{width:100%;background:#000;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;outline:0}input:focus,textarea:focus{border-color:var(--g)}
.btn{width:100%;background:var(--g);color:#000;font-weight:700;padding:12px;border-radius:12px}.btn.o{background:none;color:var(--t);border:1px solid var(--b)}
.err{color:#ff6b6b;min-height:20px;font-size:13px}
.app{display:flex;height:100%}
.side{width:268px;background:#0a0a0a;border-right:1px solid #1c1c1f;display:flex;flex-direction:column;padding:12px 10px;gap:2px;overflow:auto;transition:transform .25s;z-index:30}
.side .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;padding:6px 8px 14px;font-size:17px}.logo img{width:30px;border-radius:50%}
.side button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;color:#b4b4ba;font-size:14.5px;font-weight:500}
.side button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side button:hover{background:#151517;color:#fff}.side button.on{background:#1c1c1f;color:#fff}
.side .sec{font-size:12px;color:#6d6d74;padding:14px 10px 4px}
.side .plus{margin:8px 0 4px;border:1px solid #3a2f12;background:linear-gradient(135deg,#17130a,#0a0a0a);color:var(--g)}
.side .plus:hover{background:#17130a;color:var(--g)}.side hr{border:0;border-top:1px solid #1c1c1f;margin:8px 0}.sp{flex:1}
.usr{display:flex;align-items:center;gap:10px;padding:10px 8px;font-size:13px;color:#9a9aa1;overflow:hidden}.usr i{width:32px;height:32px;border-radius:50%;background:#26262a;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:600;flex:none}
.usr div{min-width:0}.usr b{display:block;color:#ececec;font-weight:600;font-size:14px}.usr span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--g);color:#000;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:auto}
.ov{display:none;position:fixed;inset:0;background:#000a;z-index:25}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px}.top .ham{display:none;font-size:22px}.top b{letter-spacing:1px}
#log{flex:1;overflow:auto;padding:10px 16px}
.wrap{max-width:760px;margin:0 auto}
.home{text-align:center;padding-top:8vh}.home img{width:110px;border-radius:50%}.home h2{font-size:30px;margin:12px 0 4px}.home p{color:var(--m)}
.m{margin:14px 0;display:flex}.m.u{justify-content:flex-end}
.bub{max-width:88%;white-space:pre-wrap;word-wrap:anywhere;padding:10px 14px;border-radius:16px}
.u .bub{background:#1b1b1f}.a .bub{padding-left:0}
pre{background:#111;border:1px solid var(--b);border-radius:10px;padding:10px;overflow:auto;margin:8px 0;font-size:13px}
.m img,.m iframe{max-width:100%;border-radius:12px}iframe{width:100%;height:420px;border:1px solid var(--b);background:#fff}
.bar{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.box{max-width:760px;margin:0 auto;background:var(--p);border:1px solid var(--b);border-radius:24px;padding:8px 8px 8px 16px;display:flex;align-items:flex-end;gap:8px}
.box textarea{border:0;margin:0;background:none;resize:none;max-height:140px;padding:8px 0}
.send{width:38px;height:38px;border-radius:50%;background:var(--g);color:#000;font-weight:800;flex:none}
.chips{max-width:760px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}.chips button{border:1px solid var(--b);border-radius:20px;padding:5px 12px;color:var(--m);font-size:13px}.chips .on{border-color:var(--g);color:var(--g)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}
.stats{display:flex;gap:10px;margin:12px 0}.stats div{flex:1;background:var(--p);border:1px solid var(--b);border-radius:12px;padding:12px}.stats b{display:block;font-size:22px;color:var(--g)}
@media(max-width:760px){.side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}.side.open{transform:none}.side.open+.ov{display:block}.top .ham{display:block}}
</style></head><body>
